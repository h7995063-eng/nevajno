<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBERSHOKE — Матчи</title>
<link rel="stylesheet" href="css/style_main.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="logo-area">
      <img src="assets/logo_mono.svg" alt="CYBERSHOKE">
    </div>
    <a href="#" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Матчи</a>
    <a href="stats_final.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg> Лидерборд</a>
    <a href="missions_final.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Миссии <span class="badge">0/5</span></a>
    <a href="profile_final.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Профиль</a>
    <a href="premium_final.html" class="nav-item premium"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 18h20v2H2zM2 8l5 5 5-8 5 8 5-5v8H2z"/></svg> PREMIUM</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="top-bar">
      <div class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none; cursor:pointer; padding:8px;">☰</div>
      <div class="title">МАТЧИ</div>
      <div class="balance" id="online-count">0</div>
    </div>
    <div class="scroll-area">
      <div class="filters">
        <button class="filter-btn active">🎮 CS2</button>
        <button class="filter-btn">Все</button>
      </div>
      <div class="match-list" id="match-list">
        <div class="loader" style="margin:40px auto;"></div>
      </div>
    </div>
  </div>

<script src="js/app_v10.js?v=16"></script>
<script>
  (async function () {
    // 1. Загружаем онлайн
    const { data: onlineData } = await api("/api/online");
    if (onlineData?.ok) {
      document.getElementById("online-count").innerHTML = `🟢 ${onlineData.online} онлайн`;
    }

    // 2. Загружаем список матчей (лобби)
    const list = document.getElementById("match-list");
    const { data: lobbiesData } = await api("/api/lobbies");
    
    if (lobbiesData?.ok && lobbiesData.lobbies.length > 0) {
      list.innerHTML = lobbiesData.lobbies.map(l => `
        <a href="lobby_final.html" class="match-item">
          <div class="map-img" style="background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=150&q=80') center/cover;"></div>
          <div class="info">
            <div class="map-name">${l.map}</div>
            <div class="mode">${l.mode}</div>
          </div>
          <div class="players">${l.players}/${l.max_players}</div>
          <div class="time">${new Date(l.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})}</div>
          <div class="join-btn">›</div>
        </a>
      `).join("");
    } else {
      list.innerHTML = '<div class="card" style="text-align:center; padding:40px; color:var(--muted);">Пока нет активных матчей. Создайте первый!</div>';
    }
  })();
</script>
</body>
</html>
