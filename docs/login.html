<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Регистрация — CYBERSHOK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <img src="assets/logo.svg" alt="CYBERSHOK" class="logo">
    <div class="title">
      <h1>РЕГИСТРАЦИЯ</h1>
      <div class="sub">СОЗДАЙ ПРОФИЛЬ</div>
    </div>
  </div>

  <form id="reg-form" class="form">
    <div class="field">
      <label>Ник в игре</label>
      <input name="nickname" placeholder="Придумайте ник" required maxlength="32">
    </div>
    <div class="field">
      <label>ID в CounterFlame</label>
      <input name="game_id" placeholder="Введите ваш ID в CounterFlame" required maxlength="64">
    </div>
    <button type="submit" class="btn btn-primary">
      СОЗДАТЬ ПРОФИЛЬ
    </button>
  </form>
</div>

<script src="js/config_v2.js?v=100"></script>
<script>
  (async function () {
    // Сразу проверяем, зарегистрирован ли
    const { data } = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({ init_data: initData }),
    });

    if (data?.ok && !data.need_register) {
      localStorage.setItem("cs_token", data.token);
      localStorage.setItem("cs_user", JSON.stringify(data.user));
      location.replace("main_v2.html");
      return;
    }

    // Если нет — показываем форму
    document.getElementById("reg-form").onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = "СОЗДАНИЕ...";

      const fd = new FormData(e.target);
      const { data: r } = await api("/api/auth/register", {
        method: "POST",
        body: JSON.stringify({
          init_data: initData,
          nickname: fd.get("nickname"),
          game_id: fd.get("game_id"),
        }),
      });

      if (r?.ok) {
        localStorage.setItem("cs_token", r.token);
        localStorage.setItem("cs_user", JSON.stringify(r.user));
        toast("Добро пожаловать ✅", "ok");
        setTimeout(() => location.replace("main_v2.html"), 800);
      } else if (r?.error === "already_registered") {
        location.replace("main_v2.html");
      } else {
        toast(r?.error || "Ошибка", "error");
        btn.disabled = false;
        btn.textContent = "СОЗДАТЬ ПРОФИЛЬ";
      }
    };
  })();
</script>
</body>
</html>
