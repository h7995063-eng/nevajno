<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>API test</title></head>
<body style="background:#111;color:#0f0;font-family:monospace;padding:20px">
<h2>Проверка API</h2>
<div id="out">Загрузка...</div>
<script src="config.js"></script>
<script>
const out = document.getElementById('out');
out.textContent = 'window.API_URL = ' + window.API_URL + '\n\n';

fetch(window.API_URL + '/api/auth', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json',
    'X-Dev-User': JSON.stringify({id: 6999358439, username: 'dev'})
  },
  body: JSON.stringify({nickname: 'testuser', game_id: '123456'})
})
.then(r => r.text().then(t => ({status: r.status, body: t})))
.then(({status, body}) => {
  out.textContent += 'HTTP ' + status + '\n\n' + body;
})
.catch(e => {
  out.textContent += '❌ Failed to fetch\n\n' + e.message;
});
</script>
</body></html>
