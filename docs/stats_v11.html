<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТОПЫ — CYBERSHOKE</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 30px; padding-top: 20px;}
  .podium-item { display: flex; flex-direction: column; align-items: center; text-align: center; width: 90px; }
  .podium-item .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--bg-2); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; border: 2px solid var(--border); margin-bottom: 8px; position: relative; }
  .podium-item .nick { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .podium-item .points { font-size: 10px; color: var(--accent-2); font-weight: 700; }
  .podium-block { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px 8px 0 0; margin-top: 8px; display: flex; justify-content: center; align-items: flex-start; padding-top: 8px; font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: rgba(255,255,255,0.1); }
  
  .pos-1 .podium-block { height: 90px; background: rgba(240,179,88,0.1); border-color: rgba(240,179,88,0.3); }
  .pos-2 .podium-block { height: 70px; }
  .pos-3 .podium-block { height: 50px; }
  
  .pos-1 .avatar { border-color: #f0b358; width: 60px; height: 60px; font-size: 24px; }
  .crown { position: absolute; top: -16px; width: 24px; height: 24px; }

  .top-list { display: flex; flex-direction: column; gap: 8px; }
  .top-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--text); }
  .top-item .rank { font-family: 'Orbitron'; font-weight: 900; font-size: 16px; color: var(--muted); width: 28px; }
  .top-item .nick { flex: 1; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .top-item .points { font-family: 'Orbitron'; color: var(--accent-2); font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="main_v11.html" class="back"><svg><use href="assets/icons/back.svg#i"/></svg></a>
    <div class="title"><h1>ЛИДЕРБОРД</h1><div class="sub">КИБЕР ПОИНТЫ</div></div>
  </div>
  
  <div id="podium-container"></div>
  <div id="top-list" class="top-list"></div>
</div>
<nav class="bottom-nav">
  <a href="main_v11.html"><svg><use href="assets/icons/home.svg#i"/></svg>Главная</a>
  <a href="lobby_v11.html"><svg><use href="assets/icons/sword.svg#i"/></svg>Лобби</a>
  <a href="stats_v11.html" class="active"><svg><use href="assets/icons/trophy.svg#i"/></svg>Топы</a>
  <a href="profile_v11.html"><svg><use href="assets/icons/user.svg#i"/></svg>Профиль</a>
</nav>
<script src="js/app_v10.js?v=3"></script>
<script>
  (async function () {
    const list = document.getElementById("top-list");
    const podium = document.getElementById("podium-container");
    list.innerHTML = '<div class="loader"></div>';
    
    const { data } = await api("/api/stats/top");
    if (!data?.ok || !data.top.length) { list.innerHTML = '<div class="empty">Пока нет игроков</div>'; return; }

    const top3 = data.top.slice(0, 3);
    const rest = data.top.slice(3);

    // Строим подиум (2, 1, 3)
    if (top3.length >= 3) {
      podium.innerHTML = `
        <div class="podium">
          <div class="podium-item pos-2">
            <div class="avatar">${top3[1].nickname.charAt(0)}</div>
            <div class="nick">${top3[1].nickname}</div>
            <div class="points">${top3[1].elo} CP</div>
            <div class="podium-block">2</div>
          </div>
          <div class="podium-item pos-1">
            <div class="avatar">
              <svg class="crown"><use href="assets/icons/crown.svg#i"/></svg>
              ${top3[0].nickname.charAt(0)}
            </div>
            <div class="nick">${top3[0].nickname} ${top3[0].is_premium ? '<span class="badge badge-premium">★</span>' : ''}</div>
            <div class="points">${top3[0].elo} CP</div>
            <div class="podium-block">1</div>
          </div>
          <div class="podium-item pos-3">
            <div class="avatar">${top3[2].nickname.charAt(0)}</div>
            <div class="nick">${top3[2].nickname}</div>
            <div class="points">${top3[2].elo} CP</div>
            <div class="podium-block">3</div>
          </div>
        </div>
      `;
    }

    // Остальной список
    if (rest.length) {
      list.innerHTML = rest.map((u, i) => `
        <a href="player_v11.html?nick=${encodeURIComponent(u.nickname)}" class="top-item">
          <div class="rank">#${i + 4}</div>
          <div class="nick">${u.nickname} ${u.is_premium ? '<span class="badge badge-premium">★ PRO</span>' : ''}</div>
          <div class="points">${u.elo} CP</div>
        </a>
      `).join("");
    } else if (top3.length < 3) {
      // Если игроков меньше 3
      list.innerHTML = data.top.map((u, i) => `
        <a href="player_v11.html?nick=${encodeURIComponent(u.nickname)}" class="top-item">
          <div class="rank">#${i + 1}</div>
          <div class="nick">${u.nickname}</div>
          <div class="points">${u.elo} CP</div>
        </a>
      `).join("");
    }
  })();
</script>
</body>
</html>
