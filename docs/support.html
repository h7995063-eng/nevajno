<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поддержка — CYBERSHOKE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f111a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
        .header { display: flex; align-items: center; padding: 20px; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; background: #0f111a; z-index: 10; }
        .back-btn { background: rgba(255,255,255,0.05); border: none; color: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #8b92a5; margin-bottom: 8px; }
        .form-control { width: 100%; background: #1a1d2d; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; color: #fff; font-family: inherit; font-size: 15px; outline: none; box-sizing: border-box; }
        .form-control:focus { border-color: #6b7cff; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .warning-box { background: rgba(255, 77, 77, 0.1); border: 1px solid rgba(255, 77, 77, 0.2); border-radius: 12px; padding: 16px; font-size: 13px; color: #ffb3b3; margin-bottom: 24px; line-height: 1.5; }
        .btn-submit { width: 100%; background: #6b7cff; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-submit:active { transform: scale(0.98); }
        .rules-header { display: flex; align-items: center; gap: 12px; margin: 32px 0 20px 0; font-size: 18px; font-weight: 600; }
        .rules-header img { width: 32px; height: 32px; }
        .accordion { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .accordion-header { padding: 16px; display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; font-size: 15px; }
        .accordion-icon { font-size: 20px; color: #6b7cff; transition: transform 0.3s; }
        .accordion.active .accordion-icon { transform: rotate(45deg); }
        .accordion-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: rgba(0,0,0,0.2); }
        .accordion-content-inner { padding: 16px; font-size: 14px; color: #b0b5c5; line-height: 1.6; }
        .accordion-content-inner ul { margin: 8px 0 12px 0; padding-left: 20px; }
        .accordion-content-inner li { margin-bottom: 6px; }
        .rule-punish { color: #ff7d7d; font-size: 13px; margin-top: 12px; display: block; font-weight: 500; }
        .rule-title { color: #fff; font-weight: 600; display: block; margin-top: 12px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <div style="font-weight: 600; font-size: 18px;">Поддержка</div>
    </div>
    <div class="content">
        <div class="form-card">
            <div class="warning-box">
                <b>⚠️ Внимание!</b><br>
                За бессмысленную отправку заявки (спам, флуд) выносится предупреждение (WARN) или мут. В случае систематического нарушения — бан без возможности разблокировки.
            </div>
            <form id="supportForm">
                <div class="form-group">
                    <label>Категория жалобы</label>
                    <select class="form-control" id="ticketCategory">
                        <option value="Жалоба на игрока">Жалоба на игрока</option>
                        <option value="Жалоба на администратора">Жалоба на администратора</option>
                        <option value="Проблема с лобби/матчем">Проблема с лобби/матчем</option>
                        <option value="Техническая проблема">Техническая проблема</option>
                        <option value="Апелляция наказания">Апелляция наказания</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Причина / Описание жалобы</label>
                    <textarea class="form-control" id="ticketMessage" placeholder="Опишите ситуацию подробно..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Отправить жалобу</button>
            </form>
        </div>
        <div class="form-card" style="margin-top:24px;"><div style="font-weight:600; margin-bottom:12px;">Мои обращения</div><div id="my-tickets-container" style="font-size:14px; color:#b0b5c5;">Загрузка...</div></div><div class="rules-header">
            <img src="assets/logo.svg" alt="Logo" onerror="this.style.display='none'">
            <span>Правила площадки CYBERSHOKE</span>
        </div>
        <div id="accordionContainer"></div>
    </div>
    <script>
        const rulesData = [
            { title: "1. ОБЩЕНИЕ И ПОВЕДЕНИЕ", content: "<span class='rule-title'>1.1. Оскорбления</span><ul><li>Запрещены прямые оскорбления участников.</li><li>Запрещены унижения, травля и переходы на личности.</li><li>Запрещено оскорбление родственников.</li></ul><span class='rule-punish'>Наказание: WARN / MUTE / BAN в зависимости от тяжести.</span><span class='rule-title'>1.2. Провокации и конфликты</span><ul><li>Запрещено намеренно провоцировать участников.</li><li>Запрещено разжигать конфликты.</li><li>Запрещено продолжать ссоры после просьбы администрации.</li></ul><span class='rule-punish'>Наказание: WARN / MUTE / BAN.</span><span class='rule-title'>1.3. Флуд и спам</span><ul><li>Запрещено отправлять большое количество одинаковых сообщений.</li><li>Запрещено злоупотреблять CAPS LOCK.</li><li>Запрещено засорять чат бессмысленными сообщениями.</li><li>Запрещено многократно отправлять стикеры, GIF и эмодзи.</li></ul><span class='rule-punish'>Наказание: MUTE.</span><span class='rule-title'>1.4. Неприемлемый контент</span><ul><li>Запрещены материалы 18+.</li><li>Запрещены шокирующие и жестокие материалы.</li><li>Запрещено распространять оскорбительный контент.</li></ul><span class='rule-punish'>Наказание: MUTE / BAN.</span>" },
            { title: "2. ПРАВИЛА ИГРЫ И МАТЧЕЙ", content: "<span class='rule-title'>2.1. Честная игра</span><ul><li>Запрещено использовать читы и сторонние программы.</li><li>Запрещено использовать баги для получения преимущества.</li><li>Запрещено намеренно портить игру своей команде.</li></ul><span class='rule-punish'>Наказание: BAN / дисквалификация.</span><span class='rule-title'>2.2. Срыв матчей</span><ul><li>Запрещено намеренно покидать матч.</li><li>Запрещено мешать проведению матча.</li><li>Запрещено намеренно затягивать начало игры.</li><li>Запрещено отказываться от согласованных условий.</li></ul><span class='rule-punish'>Наказание: WARN / временный BAN.</span><span class='rule-title'>2.3. Нечестные результаты</span><ul><li>Запрещено подделывать результаты матчей.</li><li>Запрещено отправлять изменённые скриншоты.</li><li>Запрещено предоставлять ложную статистику.</li><li>Запрещено договариваться о фиктивных результатах.</li></ul><span class='rule-punish'>Наказание: аннулирование результата / BAN.</span><span class='rule-title'>2.4. AFK и бездействие</span><ul><li>Запрещено намеренно бездействовать во время матча.</li><li>Запрещено систематически создавать неудобства команде.</li></ul><span class='rule-punish'>Наказание: WARN / временный BAN.</span>" },
            { title: "3. ПРАВИЛА ЛОББИ", content: "<span class='rule-title'>3.1. Создание лобби</span><ul><li>Запрещено создавать фальшивые лобби.</li><li>Запрещено создавать лобби без намерения играть.</li><li>Запрещено намеренно вводить участников в заблуждение.</li></ul><span class='rule-title'>3.2. Участие в лобби</span><ul><li>Запрещено занимать место без намерения участвовать.</li><li>Запрещено мешать набору игроков.</li><li>Запрещено намеренно срывать сбор команды.</li></ul><span class='rule-punish'>Наказание: WARN / MUTE / временный BAN.</span>" },
            { title: "4. РЕКЛАМА И ПОСТОРОННИЕ ССЫЛКИ", content: "<span class='rule-title'>4.1. Реклама</span><ul><li>Запрещена реклама сторонних проектов без разрешения администрации.</li><li>Запрещена массовая рассылка рекламных сообщений.</li><li>Запрещено переманивать участников в другие сообщества.</li></ul><span class='rule-title'>4.2. Ссылки</span><ul><li>Запрещено распространять подозрительные ссылки.</li><li>Запрещено отправлять ссылки на вредоносные ресурсы.</li><li>Запрещено маскировать ссылки с целью обмана.</li></ul><span class='rule-punish'>Наказание: MUTE / BAN.</span>" },
            { title: "5. ОБМАН И МОШЕННИЧЕСТВО", content: "<span class='rule-title'>5.1. Обман участников</span><ul><li>Запрещено выдавать себя за администратора.</li><li>Запрещено обманывать ради получения доступа или ценностей.</li><li>Запрещено распространять ложную информацию от имени проекта.</li></ul><span class='rule-title'>5.2. Использование системы</span><ul><li>Запрещено использовать ошибки системы для получения преимуществ.</li><li>Запрещено пытаться получить чужой аккаунт.</li><li>Запрещено обходить ограничения через доп. аккаунты.</li></ul><span class='rule-punish'>Наказание: временный / постоянный BAN.</span>" },
            { title: "6. ПРАВИЛА ОБЩЕНИЯ С АДМИНИСТРАЦИЕЙ", content: "<span class='rule-title'>6.1. Уважение</span><ul><li>Запрещено оскорблять администрацию.</li><li>Запрещено мешать работе администрации.</li><li>Запрещено намеренно создавать ложные жалобы.</li></ul><span class='rule-title'>6.2. Обжалование наказаний</span><ul><li>Каждый участник имеет право подать апелляцию.</li><li>Апелляция должна содержать причину и доказательства.</li><li>Запрещено спамить администраторам с требованием снять наказание.</li></ul><span class='rule-title'>6.3. Полномочия администрации</span><ul><li>Администраторам запрещено выдавать наказания без оснований.</li><li>Запрещено использовать админ-возможности в личных целях.</li><li>Серьёзные наказания должны иметь зафиксированную причину.</li></ul>" },
            { title: "7. СИСТЕМА НАКАЗАНИЙ", content: "<span class='rule-title'>7.1. WARN — предупреждение</span><p>Выдаётся за незначительные нарушения или первое нарушение.</p><span class='rule-title'>7.2. MUTE — ограничение общения</span><p>Временно запрещает отправлять сообщения. Причины: флуд, оскорбления, провокации, реклама.</p><span class='rule-title'>7.3. BAN — блокировка</span><p>Временно или навсегда ограничивает доступ. Причины: читы, мошенничество, подделка результатов, обход наказания, взлом.</p>" },
            { title: "8. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ", content: "<ul><li>Администрация рассматривает каждый случай индивидуально.</li><li>Тяжесть наказания определяется с учётом обстоятельств.</li><li>Запрещено намеренно искать лазейки в правилах.</li><li>Администрация обязана указывать понятную причину наказания.</li><li>Правила могут обновляться с уведомлением участников.</li></ul><p style='margin-top:12px;'>Участвуя в CYBERSHOKE, вы соглашаетесь соблюдать данные правила.<br><br><b>CYBERSHOKE ©</b></p>" }
        ];
        const container = document.getElementById("accordionContainer");
        rulesData.forEach(rule => {
            const div = document.createElement("div");
            div.className = "accordion";
            div.innerHTML = `<div class="accordion-header"><span>${rule.title}</span><span class="accordion-icon">+</span></div><div class="accordion-content"><div class="accordion-content-inner">${rule.content}</div></div>`;
            container.appendChild(div);
            div.querySelector(".accordion-header").addEventListener("click", () => {
                const content = div.querySelector(".accordion-content");
                if (div.classList.contains("active")) {
                    div.classList.remove("active"); content.style.maxHeight = null;
                } else {
                    div.classList.add("active"); content.style.maxHeight = content.scrollHeight + "px";
                }
            });
        });
        async function loadMyTickets() {
            const container = document.getElementById("my-tickets-container");
            try {
                const res = await fetch("/api/support/my", {
                    headers: { "X-Init-Data": window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "" }
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                if (!data.length) {
                    container.innerHTML = "У вас пока нет обращений.";
                    return;
                }
                container.innerHTML = data.map(t => `
                    <div style="border-bottom:1px solid rgba(255,255,255,0.05); padding:12px 0;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                            <b style="color:#6b7cff;">#${t.id} | ${t.category}</b>
                            <span style="color:${t.status === 'open' ? '#ffb3b3' : '#7dffb3'}; font-size:12px;">${t.status === 'open' ? 'Ожидает ответа' : 'Закрыта'}</span>
                        </div>
                        <div style="color:#8b92a5; font-size:13px; margin-bottom:6px;">${t.message}</div>
                        ${t.admin_reply ? `<div style="color:#7dffb3; font-size:13px; background:rgba(125,255,179,0.1); padding:8px; border-radius:8px;"><b>Ответ:</b> ${t.admin_reply}</div>` : ""}
                    </div>
                `).join("");
            } catch(e) {
                container.innerHTML = "Не удалось загрузить историю.";
            }
        }
        loadMyTickets();

        document.getElementById("supportForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button");
            btn.disabled = true; btn.textContent = "Отправка...";
            try {
                const res = await fetch("/api/support", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-Init-Data": window.Telegram?.WebApp?.initData || "" },
                    body: JSON.stringify({ 
                        category: document.getElementById("ticketCategory").value, 
                        message: document.getElementById("ticketMessage").value 
                    })
                });
                if (res.ok) { alert("✅ Жалоба отправлена!"); document.getElementById("supportForm").reset(); loadMyTickets(); } 
                else { alert("❌ Ошибка отправки"); }
            } catch (err) { alert("❌ Ошибка сети"); } 
            finally { btn.disabled = false; btn.textContent = "Отправить жалобу"; }
        });
    </script>
</body>
</html>
