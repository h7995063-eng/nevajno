<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лобби — CYBERSHOK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <a href="main_v2.html" class="back"><svg><use href="assets/icons/back.svg#i"/></svg></a>
    <div class="title">
      <h1>ЛОББИ</h1>
      <div class="sub">ВЫБЕРИ МАТЧ</div>
    </div>
    <button class="back" id="create-btn" aria-label="Создать"><svg><use href="assets/icons/plus.svg#i"/></svg></button>
  </div>

  <form id="create-form" class="card hidden" style="display:none;margin-bottom:16px">
    <div class="field">
      <label>Код из игры</label>
      <input name="code" placeholder="Например: KF-7H3D" required maxlength="32">
    </div>
    <div class="field">
      <label>Режим</label>
      <select name="mode" id="mode" required></select>
    </div>
    <div class="field">
      <label>Карта</label>
      <select name="map" id="map" required></select>
    </div>
    <button type="submit" class="btn btn-primary">СОЗДАТЬ ЛОББИ</button>
  </form>

  <div id="lobbies"></div>
</div>

<script src="js/config.js"></script>
<script src="js/lobby.js?v=999"></script>
<script>
  // показать форму при клике
  document.getElementById("create-btn").addEventListener("click", () => {
    const f = document.getElementById("create-form");
    f.style.display = f.style.display === "none" ? "block" : "none";
  });
</script>
</body>
</html>
